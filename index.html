<head>

<title>Registre des membres</title>
<style>
  :root{
    --gold:#F2B705; --gold2:#FFD23F; --teal:#2BC4B5; --coral:#FF6F5E; --violet:#8B7FD6; --blue:#5FA8D3;
    --text:#241E38; --muted:#6B6485; --muted2:#948EB0; --border:#E9E4F7; --inputbg:#F4F1FA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; color:var(--text);
    font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(29,78,216,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(96,165,250,0.14), transparent 55%),
      linear-gradient(180deg,#FBFDFF 0%,#F0F6FF 45%,#EAF2FF 100%);
  }
  .font-display{font-weight:700;}
  .title-gradient{background:linear-gradient(120deg,#8B6A00,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .glass{background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);border:1px solid rgba(43,30,90,0.08);box-shadow:0 4px 20px rgba(43,30,90,0.06);border-radius:20px;}
  .glass-strong{background:rgba(255,255,255,0.94);backdrop-filter:blur(20px);border:1px solid rgba(43,30,90,0.1);box-shadow:0 8px 30px rgba(43,30,90,0.12);}
  .ledger-row{border-bottom:1px solid rgba(43,30,90,0.08);}
  .ledger-row:last-child{border-bottom:none;}
  input,textarea{color:var(--text);background:var(--inputbg);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:14px;outline:none;width:100%;font-family:inherit;}
  input:focus,textarea:focus{border-color:var(--gold);}
  input::placeholder,textarea::placeholder{color:var(--muted2);}
  button{font-family:inherit; cursor:pointer;}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#16112A;font-weight:700;border:none;border-radius:16px;padding:13px;font-size:14px;box-shadow:0 8px 24px rgba(242,183,5,0.3);}
  .btn-teal{background:linear-gradient(135deg,var(--teal),var(--blue));color:#0D2B28;font-weight:700;border:none;border-radius:16px;padding:12px;font-size:14px;}
  .container{max-width:640px;margin:0 auto;padding:24px 16px 130px;}
  @media(min-width:900px){
    body{padding-bottom:0;}
    .container{max-width:820px;padding:32px 24px 130px;}
    .nav{max-width:480px;}
    .modal-panel{max-width:520px;}
  }
  .label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px;}
  .avatar{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#16112A;font-weight:700;font-size:13px;flex-shrink:0;overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .fab{position:fixed;bottom:96px;right:24px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;box-shadow:0 8px 24px rgba(242,183,5,0.4);font-size:26px;color:#16112A;background:linear-gradient(135deg,var(--gold),var(--coral));}
  .nav{position:fixed;bottom:16px;left:16px;right:16px;max-width:640px;margin:0 auto;border-radius:999px;display:flex;padding:6px;}
  .nav button{flex:1;background:none;border:none;padding:10px 0;border-radius:999px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--muted2);}
  .nav button.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#16112A;}
  .modal-overlay{position:fixed;inset:0;background:rgba(30,20,50,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;backdrop-filter:blur(2px);}
  .modal-panel{width:100%;max-width:480px;max-height:85vh;display:flex;flex-direction:column;border-radius:24px 24px 0 0;}
  @media(min-width:640px){.modal-overlay{align-items:center;} .modal-panel{border-radius:24px;}}
  .modal-body{overflow-y:auto;padding:20px;flex:1;}
  .modal-footer{padding:16px 20px;border-top:1px solid var(--border);}
  .app-header{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;margin-bottom:20px;border-radius:24px;
    background:radial-gradient(520px 240px at 100% 0%,rgba(255,210,63,0.30),transparent 60%),radial-gradient(320px 180px at 0% 100%,rgba(95,168,211,0.28),transparent 60%),linear-gradient(135deg,#0A1330 0%,#122354 55%,#1A2E6B 100%);
    border:1px solid rgba(242,183,5,0.38);box-shadow:0 14px 34px rgba(10,19,48,0.28);}
  .app-header .kicker{font-size:10px;letter-spacing:.16em;color:#F2C94C;margin:0;text-transform:uppercase;font-weight:600;}
  .app-header h1{font-family:Georgia,'Times New Roman',serif;font-size:23px;margin:2px 0 0;color:#fff;line-height:1.2;font-weight:700;}
  .app-header .count{font-size:12px;color:rgba(255,255,255,0.72);margin:4px 0 0;}
  .logo-tile{width:48px;height:48px;border-radius:14px;background:#fff;padding:3px;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,0.35);}
  .logo-tile img{width:100%;height:100%;object-fit:contain;border-radius:11px;display:block;}
  .logout-btn{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.24);color:#fff;border-radius:14px;padding:8px 12px;font-size:12px;display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .login-screen{position:fixed;inset:0;z-index:50;overflow-y:auto;
    background:radial-gradient(700px 360px at 80% -5%,rgba(255,210,63,0.16),transparent 60%),linear-gradient(180deg,#060C1E 0%,#0A1330 100%);}
  .login-hero{position:relative;overflow:hidden;border-radius:28px;padding:30px 20px 26px;text-align:center;margin-bottom:14px;
    border:1px solid rgba(242,183,5,0.35);box-shadow:0 20px 50px rgba(0,0,0,0.45);
    background:repeating-conic-gradient(from 200deg at 75% -15%,rgba(255,215,100,0.10) 0 4deg,transparent 4deg 10deg),radial-gradient(420px 260px at 75% -10%,rgba(255,214,102,0.60),transparent 60%),linear-gradient(145deg,#0C1738 0%,#16296B 100%);}
  .login-hero .logo-big{width:104px;height:104px;border-radius:28px;background:#fff;padding:5px;margin:0 auto 16px;box-shadow:0 12px 34px rgba(0,0,0,0.5);}
  .login-hero .logo-big img{width:100%;height:100%;object-fit:contain;border-radius:23px;display:block;}
  .login-hero h1{font-family:Georgia,'Times New Roman',serif;font-size:28px;margin:0;line-height:1.15;color:#FFE9A8;text-shadow:0 2px 10px rgba(0,0,0,0.5);}
  .login-hero .place{font-size:12px;letter-spacing:.28em;color:#F2C94C;margin:8px 0 0;text-transform:uppercase;font-weight:600;}
  .login-hero .tag{font-size:13px;color:rgba(255,255,255,0.75);margin:6px 0 0;}
  .login-card{border-radius:24px;padding:20px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);}
  .login-card h2{font-family:Georgia,'Times New Roman',serif;font-size:22px;color:#fff;margin:0 0 6px;}
  .login-card p{font-size:14px;color:rgba(255,255,255,0.7);margin:0 0 16px;}
  .login-card label{display:block;font-size:13px;color:rgba(255,255,255,0.7);margin-bottom:6px;}
  .login-card input{width:100%;background:#070D1F;border:1px solid rgba(255,255,255,0.18);color:#fff;border-radius:14px;padding:15px;font-size:16px;margin-bottom:14px;}
  .login-card input:focus{border-color:var(--gold);}
  ::selection{background:var(--gold);color:#16112A;}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .photo-picker{width:88px;height:88px;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--inputbg);border:1.5px dashed var(--border);flex-shrink:0;position:relative;}
  .photo-picker img{width:100%;height:100%;object-fit:cover;}
  .photo-picker input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
</style>
</head>

async function sb(path, opts={}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      "apikey": ANON_KEY,
      "Authorization": `Bearer ${ANON_KEY}`,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=representation",
      ...(opts.headers||{})
    }
  });
  if (!res.ok) {
    const txt = await res.text().catch(()=> "");
    throw new Error(`Erreur ${res.status}: ${txt}`);
  }
  try { notifyChange(path, opts); } catch(e) {}
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ---------------- NOTIFICATIONS (ntfy) ----------------
const NTFY_SERVER = "https://ntfy.sh";
const NTFY_TOPIC = "registre-ad-colas-3citq9xsc4q0";
function ntfySend(message, title){
  try {
    fetch(NTFY_SERVER + "/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic: NTFY_TOPIC, title: title || "Registre des membres", message, tags: ["bell"], priority: 3, click: location.href.split("#")[0] })
    }).catch(()=>{});
  } catch(e) {}
}
function fmtDateFr(d){ if(!d) return ""; const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : String(d); }
function describeChange(path, opts){
  const method = (opts.method || "GET").toUpperCase();
  if(method === "GET" || !state.session) return null;
  const table = path.split("?")[0];
  const idMatch = path.match(/[?&]id=eq\.([^&]+)/);
  const id = idMatch ? decodeURIComponent(idMatch[1]) : null;
  let body = null;
  try { if(opts.body){ const b = JSON.parse(opts.body); body = Array.isArray(b) ? b[0] : b; } } catch(e) {}
  const q = v => v ? `« ${v} »` : "";
  if(table === "members"){
    if(method === "POST" && body){
      const d = state.departments.find(x=>x.id===body.dept_id);
      return `a ajouté ${q(body.name)}${d ? " à la rubrique " + q(d.name) : ""}`;
    }
    if(method === "PATCH" && body && body.name) return `a modifié la fiche de ${q(body.name)}`;
    if(method === "DELETE" && id){
      const m = state.members.find(x=>String(x.id)===String(id));
      return `a supprimé la fiche de ${q(m ? m.name : "un membre")}`;
    }
    return null;
  }
  if(table === "attendance"){
    if(method === "POST" && body) return `a enregistré la présence du ${fmtDateFr(body.attendance_date)} : ${(+body.men_count||0)+(+body.women_count||0)} personnes (${body.men_count||0} H, ${body.women_count||0} F)`;
    const a = id ? state.attendance.find(x=>String(x.id)===String(id)) : null;
    if(method === "PATCH") return `a modifié la présence du ${a ? fmtDateFr(a.attendance_date) : "culte"}${body ? " : " + ((+body.men_count||0)+(+body.women_count||0)) + " personnes" : ""}`;
    if(method === "DELETE") return `a supprimé la présence du ${a ? fmtDateFr(a.attendance_date) : "culte"}`;
    return null;
  }
  if(table === "activities"){
    const a = id ? state.activities.find(x=>String(x.id)===String(id)) : null;
    if(method === "POST" && body) return `a ajouté l'activité ${q(body.title)}${body.activity_date ? " du " + fmtDateFr(body.activity_date) : ""}`;
    if(method === "PATCH") return `a modifié l'activité ${q((body && body.title) || (a && a.title) || "")}`;
    if(method === "DELETE") return `a supprimé l'activité ${q(a ? a.title : "")}`;
    return null;
  }
  if(table === "member_events"){
    if(method === "POST" && body){
      const m = state.members.find(x=>String(x.id)===String(body.member_id));
      return `a ajouté un événement${m ? " pour " + q(m.name) : ""}`;
    }
    if(method === "DELETE") return "a supprimé un événement";
    return null;
  }
  if(table === "departments"){
    if(method === "POST" && body) return `a créé la rubrique ${q(body.name)}`;
    if(method === "DELETE" && id){
      const d = state.departments.find(x=>String(x.id)===String(id));
      return `a supprimé la rubrique ${q(d ? d.name : "")}`;
    }
    return null;
  }
  if(table === "admins"){
    if(method === "POST" && body) return `a ajouté l'administrateur ${q(body.name)}`;
    if(method === "PATCH" && body && !("last_seen" in body)) return "a modifié un administrateur";
    if(method === "DELETE") return "a supprimé un administrateur";
    return null;
  }
  return null;
}

async function uploadMemberPhoto(file){
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = `member_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${PHOTO_BUCKET}/${path}`, {

      "apikey": ANON_KEY,
      "Authorization": `Bearer ${ANON_KEY}`,

  });
  if(!res.ok){

  }
  return `${SUPABASE_URL}/storage/v1/object/public/${PHOTO_BUCKET}/${path}`;
}

const AVATAR_PAIRS = [["#F2B705","#FF6F5E"],["#2BC4B5","#5FA8D3"],["#8B7FD6","#FF6F5E"],["#5FA8D3","#2BC4B5"],["#FF6F5E","#F2B705"]];
function initials(name){ return (name||"").trim().split(/\s+/).slice(0,2).map(p=>p[0]?.toUpperCase()||"").join(""); }
function gradientFor(name){
  let h=0; const s=name||"";
  for(let i=0;i<s.length;i++) h = s.charCodeAt(i) + ((h<<5)-h);
  const p = AVATAR_PAIRS[Math.abs(h)%AVATAR_PAIRS.length];
  return `linear-gradient(135deg, ${p[0]}, ${p[1]})`;
}
const ADMIN_COLORS = ["#B8890A","#1F9188","#D94F3D","#6A5ACD","#3E7CA6","#A85E1D"];
function adminColorFor(name){
  const idx = state.admins.findIndex(a=>a.name===name);
  if(idx !== -1) return ADMIN_COLORS[idx % ADMIN_COLORS.length];
  let h=0; const s=name||"";
  for(let i=0;i<s.length;i++) h = s.charCodeAt(i) + ((h<<5)-h);
  return ADMIN_COLORS[Math.abs(h)%ADMIN_COLORS.length];
}
function hexToRgba(hex, alpha){
  const c = hex.replace("#","");
  const r = parseInt(c.substring(0,2),16), g = parseInt(c.substring(2,4),16), b = parseInt(c.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function timeAgo(iso){
  if(!iso) return "";
  const diff=(Date.now()-new Date(iso).getTime())/1000;
  if(diff<60) return "à l'instant";
  if(diff<3600) return `il y a ${Math.floor(diff/60)} min`;
  if(diff<86400) return `il y a ${Math.floor(diff/3600)} h`;
  return `il y a ${Math.floor(diff/86400)} j`;
}

function playNotificationSound(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = "sine"; o.frequency.value = 880;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.4);
    o.start(); o.stop(ctx.currentTime+0.45);
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 600);
  } catch(e){}
}

const PERSON_DEPT_NAMES = ["conseil","jadci","aoc","hac"];
function isPersonDept(deptId){
  const dept = state.departments.find(d=>d.id===deptId);
  if(!dept) return false;
  return PERSON_DEPT_NAMES.includes((dept.name||"").trim().toLowerCase());
}
function personKey(name){
  return String(name||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim().toLowerCase();
}
function uniqueMembers(){
  const seen = new Map();
  for(const m of state.members){
    if(!isPersonDept(m.dept_id)) continue;
    const key = personKey(m.name);
    if(!key) continue;
    if(!seen.has(key)){
      seen.set(key, {...m});
    } else {
      const existing = seen.get(key);
      for(const field of ["location","role","contact","comment","gender","marital_status","photo_url"]){
        if(!existing[field] && m[field]) existing[field] = m[field];
      }
    }
  }
  return Array.from(seen.values());
}

const ATT_MONTHS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function attLong(d){const p=String(d||"").split("-");return p.length===3?`${parseInt(p[2],10)} ${ATT_MONTHS[parseInt(p[1],10)-1]} ${p[0]}`:esc(String(d||""));}

function renderAttendanceStats(){
  const list = state.attendance || [];

  const tot = a => (a.men_count||0) + (a.women_count||0);
  const last = list.slice(0,8), chrono = last.slice().reverse();
  const avg = Math.round(last.reduce((s,a)=>s+tot(a),0)/last.length);
  const best = last.reduce((b,a)=>tot(a)>tot(b)?a:b, last[0]);
  const diff = list.length>1 ? tot(list[0])-tot(list[1]) : null;
  const men = last.reduce((s,a)=>s+(a.men_count||0),0), wom = last.reduce((s,a)=>s+(a.women_count||0),0), sum = men+wom;
  const menPct = sum ? Math.round(men/sum*100) : 0, womPct = sum ? 100-menPct : 0;
  const nf = n => new Intl.NumberFormat("fr-FR").format(n);
  const mx = Math.max(1, ...chrono.map(tot)), H = 120;
  const sub = t => `<div style="font-size:11px;color:var(--muted2);margin-top:2px;">${t}</div>`;
  const trend = diff===null ? sub("Premier culte")
    : `<div style="font-size:11px;margin-top:2px;color:${diff>0?"var(--teal)":diff<0?"var(--coral)":"var(--muted2)"};">${diff>0?"▲ +":diff<0?"▼ −":"= "}${Math.abs(diff)} vs précédent</div>`;
  const stat = (label,val,extra) => `<div class="glass" style="flex:1;padding:10px 12px;min-width:0;"><div style="font-size:11px;color:var(--muted);">${label}</div><div class="font-display" style="font-size:22px;margin-top:2px;">${val}</div>${extra}</div>`;
  const plural = last.length>1 ? "s" : "";
  const top = `<div style="display:flex;gap:8px;margin-bottom:12px;">${stat("Dernier culte",tot(list[0]),trend)}${stat("Moyenne",avg,sub(`${last.length} dernier${plural} culte${plural}`))}${stat("Record",tot(best),sub(attShort(best.attendance_date)))}</div>`;
  const bars = chrono.map(a=>{
    const hm = Math.round((a.men_count||0)/mx*H), hw = Math.round((a.women_count||0)/mx*H);
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;"><span style="font-size:11px;color:var(--muted);margin-bottom:3px;">${tot(a)}</span><div style="width:100%;max-width:28px;height:${hw}px;background:var(--coral);border-radius:5px 5px 0 0;"></div><div style="width:100%;max-width:28px;height:${hm}px;background:var(--blue);"></div></div>`;
  }).join("");
  const labels = chrono.map(a=>{ const p = String(a.attendance_date||"").split("-"); return `<span style="flex:1;text-align:center;font-size:10px;color:var(--muted2);min-width:0;">${p.length===3?p[2]+"/"+p[1]:""}</span>`; }).join("");
  const chart = `<div class="glass" style="padding:14px;margin-bottom:12px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><span class="font-display" style="font-size:14px;">Évolution par dimanche</span><span style="display:flex;gap:10px;font-size:11px;color:var(--muted);"><span>🔵 Hommes</span><span>🔴 Femmes</span></span></div><div style="display:flex;align-items:flex-end;gap:4px;height:${H+22}px;border-bottom:1px solid var(--border);">${bars}</div><div style="display:flex;gap:4px;margin-top:5px;">${labels}</div></div>`;
  const split = `<div class="glass" style="padding:14px;margin-bottom:12px;"><div class="font-display" style="font-size:14px;margin-bottom:10px;">Répartition sur ${last.length} culte${plural}</div><div style="display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--inputbg);"><div style="width:${menPct}%;background:var(--blue);"></div><div style="width:${womPct}%;background:var(--coral);"></div></div><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;"><span><b>${menPct} %</b> d’hommes · ${nf(men)}</span><span><b>${womPct} %</b> de femmes · ${nf(wom)}</span></div></div>`;
  const shown = state.attendanceShowAll ? list : list.slice(0,3);
  const rows = shown.map(a=>`<div class="ledger-row" style="display:flex;align-items:center;gap:8px;padding:10px 14px;"><span style="flex:1;font-size:13px;font-weight:600;">${attLong(a.attendance_date)}</span><span style="font-size:12px;color:var(--blue);">${a.men_count||0} H</span><span style="font-size:12px;color:var(--coral);">${a.women_count||0} F</span><span style="font-size:13px;font-weight:700;min-width:34px;text-align:right;">${tot(a)}</span><button onclick="handleDeleteAttendance('${a.id}')" style="background:none;border:none;color:var(--coral);font-size:12px;">🗑</button></div>`).join("");
  const more = list.length>3 ? `<button onclick="toggleAttendanceAll()" style="width:100%;background:none;border:none;border-top:1px solid rgba(43,30,90,0.08);padding:12px;font-size:13px;font-weight:600;color:#8B6A00;">${state.attendanceShowAll ? "Réduire la liste" : `Voir tout l’historique (${list.length} cultes)`}</button>` : "";
  const hist = `<div class="glass" style="overflow:hidden;"><div class="font-display" style="font-size:14px;padding:14px 14px 4px;">${state.attendanceShowAll?"Tous les cultes":"Derniers cultes"}</div>${rows}${more}</div>`;
  return top + chart + split + hist;

const ACT_TYPES = [
  { v:"mariage",  label:"Mariage",                  chip:"Mariages",  icon:"💍", color:"var(--coral)" },
  { v:"bapteme",  label:"Baptême",                  chip:"Baptêmes",  icon:"💧", color:"var(--blue)" },
  { v:"retraite", label:"Sortie / Retraite jeunes", chip:"Jeunes",    icon:"🏕️", color:"var(--teal)" },
  { v:"priere",   label:"Prière / Veillée",         chip:"Prières",   icon:"🙏", color:"var(--violet)" },
  { v:"special",  label:"Programme spécial",        chip:"Spéciaux",  icon:"⭐", color:"var(--gold)" }
];
const CUSTOM_ACT_COLORS = ["#E07A5F","#3D9970","#B07CC6","#D98E04","#2A9D8F","#5C7AEA"];
function hasActType(a){ return !!(a.category && a.category!=="autre"); }
function actType(v){
  const t = ACT_TYPES.find(x=>x.v===v);
  if(t) return t;
  if(!v || v==="autre") return { v:"", label:"Non classé", chip:"Non classées", icon:"📌", color:"#6B6485" };
  let h = 0; for(const c of String(v)) h = (h*31 + c.charCodeAt(0)) % CUSTOM_ACT_COLORS.length;
  return { v, label:v, chip:v, icon:"🏷️", color:CUSTOM_ACT_COLORS[h] };
}
function customActTypes(){
  const set = new Set();
  state.activities.forEach(a=>{ if(hasActType(a) && !ACT_TYPES.some(t=>t.v===a.category)) set.add(a.category); });
  return Array.from(set).sort((x,y)=>x.localeCompare(y,"fr"));
}
function normalizeActType(text){
  const raw = String(text||"").trim().replace(/\s+/g," ");
  if(!raw) return "";
  const key = personKey(raw);
  for(const t of ACT_TYPES){ if(personKey(t.label)===key || personKey(t.chip)===key || t.v===key) return t.v; }
  for(const c of customActTypes()){ if(personKey(c)===key) return c; }
  return raw.charAt(0).toUpperCase() + raw.slice(1);
}
function attrJs(v){ return JSON.stringify(v).replace(/'/g,"&#39;"); }
function daysUntil(dateStr){
  const m = String(dateStr||"").match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return null;
  const t = new Date();
  return Math.round((Date.UTC(+m[1],+m[2]-1,+m[3]) - Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())) / 86400000);
}
function fmtLongDate(dateStr){
  const m = String(dateStr||"").match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return "";
  const txt = new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  return txt.charAt(0).toUpperCase() + txt.slice(1);
}
function relDays(n){
  if(n===null) return "";
  if(n===0) return "Aujourd'hui";
  if(n===1) return "Demain";
  if(n===-1) return "Hier";
  return n>1 ? `Dans ${n} jours` : `Il y a ${-n} jours`;
}
function fmtTime(t){ const m = String(t||"").match(/^(\d{1,2}):(\d{2})/); return m ? `${+m[1]}h${m[2]}` : ""; }

function icsEsc(t){ return String(t||"").replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;"); }
function addActivityToCalendar(id){
  const a = state.activities.find(x=>String(x.id)===String(id));
  if(!a || !a.activity_date){ alert("Cette activité n'a pas de date."); return; }
  const m = String(a.activity_date).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m){ alert("Date invalide."); return; }
  const pad = n => String(n).padStart(2,"0");
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const t = String(a.activity_time||"").match(/^(\d{1,2}):(\d{2})/);
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Registre des membres//FR","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT",
    "UID:activite-" + a.id + "@registre-membres", "DTSTAMP:" + stamp];
  if(t){
    const start = new Date(+m[1], +m[2]-1, +m[3], +t[1], +t[2]);
    const end = new Date(start.getTime() + 2*3600*1000);
    const f = d => d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00";
    lines.push("DTSTART:" + f(start), "DTEND:" + f(end));
  } else {
    const day = new Date(+m[1], +m[2]-1, +m[3]), next = new Date(+m[1], +m[2]-1, +m[3]+1);
    const f = d => d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate());
    lines.push("DTSTART;VALUE=DATE:" + f(day), "DTEND;VALUE=DATE:" + f(next));
  }
  lines.push("SUMMARY:" + icsEsc(actType(a.category).icon + " " + a.title));
  if(a.location) lines.push("LOCATION:" + icsEsc(a.location));
  if(a.description) lines.push("DESCRIPTION:" + icsEsc(a.description));
  const alarm = (trigger, text) => ["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + icsEsc(text),"TRIGGER:" + trigger,"END:VALARM"];
  if(t){
    lines.push(...alarm("-P1D","Demain : " + a.title), ...alarm("-PT1H","Dans 1 heure : " + a.title), ...alarm("PT0S","Maintenant : " + a.title));
  } else {
    lines.push(...alarm("-PT15H","Demain : " + a.title), ...alarm("PT7H","Aujourd'hui : " + a.title));
  }
  lines.push("END:VEVENT","END:VCALENDAR");
  downloadBlob(new Blob([lines.join("\r\n")], { type:"text/calendar;charset=utf-8" }), "activite-" + exportFileName(a.title) + ".ics");
}

async function markSeen(){
  if(!state.session) return;
  const now = new Date().toISOString();
  try {
    await sb(`admins?id=eq.${state.session.id}`, { method:"PATCH", body: JSON.stringify({ last_seen: now }) });
    state.session.last_seen = now;
    const a = state.admins.find(x=>x.id===state.session.id);
    if(a) a.last_seen = now;
  } catch(e){}
}

function openTab(t){ state.tab = t; render(); if(t==="journal") markSeen().then(render); }

function computeActivity(){
  const items = [];
  for(const m of state.members){
    const dept = state.departments.find(d=>d.id===m.dept_id);
    if(m.added_at) items.push({ id:`${m.id}_add`, at:m.added_at, isEdit:false, by:m.added_by, text:`a ajouté ${m.name}${dept?` dans "${dept.name}"`:""}` });
    if(m.updated_at && m.updated_at !== m.added_at) items.push({ id:`${m.id}_upd`, at:m.updated_at, isEdit:true, by:m.updated_by||m.added_by, text:`a modifié la fiche de ${m.name}` });
  }
  items.sort((a,b)=> new Date(b.at)-new Date(a.at));
  return items;
}

function deptMembers(deptId){
  const q = state.query.trim().toLowerCase();
  return state.members.filter(m=>m.dept_id===deptId).filter(m=>
    !q || (m.name||"").toLowerCase().includes(q) || (m.location||"").toLowerCase().includes(q) || (m.role||"").toLowerCase().includes(q)
  );
}

function onPhotoSelected(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  pendingPhotoFile = file;
  const reader = new FileReader();
  reader.onload = () => {
    const box = document.getElementById("mf-photo-box");
    if(box) box.innerHTML = `<img src="${reader.result}" /><input type="file" accept="image/*" onchange="onPhotoSelected(event)" />`;
  };
  reader.readAsDataURL(file);
}

async function handleSaveMember(){
  const name = document.getElementById("mf-name").value.trim();
  if(!name) return;
  state.error = "";
  const form = {
    name,
    role: document.getElementById("mf-role").value.trim(),
    location: document.getElementById("mf-location").value.trim(),
    contact: document.getElementById("mf-contact").value.trim(),
    comment: document.getElementById("mf-comment").value.trim(),
    gender: document.getElementById("mf-gender").value,
    marital_status: document.getElementById("mf-marital").value || null,
  };
  try {
    if(pendingPhotoFile){
      state.savingPhoto = true; render();
      form.photo_url = await uploadMemberPhoto(pendingPhotoFile);
      state.savingPhoto = false;
    } else if(state.editingMemberId){
      form.photo_url = state.memberForm.photoUrl || null;
    }
    if(state.editingMemberId){
      await sb(`members?id=eq.${state.editingMemberId}`, { method:"PATCH", body: JSON.stringify({ ...form, updated_by: state.session.name, updated_at: new Date().toISOString() }) });
    } else {
      await sb("members", { method:"POST", body: JSON.stringify([{ ...form, dept_id: state.selectedDept, added_by: state.session.name }]) });
    }
    // Même personne dans plusieurs rubriques : la situation matrimoniale reste identique partout
    if(form.marital_status){
      const key = personKey(name);
      const others = state.members.filter(m=> personKey(m.name)===key && String(m.id)!==String(state.editingMemberId) && m.marital_status!==form.marital_status);
      for(const o of others){
        await sb(`members?id=eq.${o.id}`, { method:"PATCH", body: JSON.stringify({ marital_status: form.marital_status }) });
      }
    }
    pendingPhotoFile = null;
    await loadData();
    state.panel = null;
    render();
  } catch(e){ state.savingPhoto = false; state.error = "Erreur d'enregistrement : " + e.message; render(); }
}

async function handleDeleteMember(id){

function exportRows(deptId){
  return state.members.filter(m=>m.dept_id===deptId)
    .slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"","fr"))
    .map(m=>({
      nom: (m.name||"").trim(),
      role: (m.role||"").trim(),
      lieu: (m.location||"").trim(),
      contact: (m.contact||"").trim(),
      sexe: m.gender==="homme" ? "Homme" : m.gender==="femme" ? "Femme" : "",
      situ: maritalLabel(m.marital_status)
    }));
}
function exportDate(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function exportFileName(name){
  return String(name||"rubrique").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-+|-+$/g,"").toLowerCase() || "rubrique";
}
// --- Écriture d'un vrai fichier .xlsx (sans bibliothèque externe) ---
const CRC_TABLE = (()=>{ const t=[]; for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; } return t; })();
function crc32(bytes){ let c=0xFFFFFFFF; for(let i=0;i<bytes.length;i++) c = CRC_TABLE[(c^bytes[i])&0xFF] ^ (c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = (now.getHours()<<11) | (now.getMinutes()<<5) | (now.getSeconds()>>1);
  const dosDate = ((now.getFullYear()-1980)<<9) | ((now.getMonth()+1)<<5) | now.getDate();
  for(const f of files){
    const name = enc.encode(f.name), data = enc.encode(f.content), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,dosTime,true); lh.setUint16(12,dosDate,true); lh.setUint32(14,crc,true);
    lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,dosTime,true); ch.setUint16(14,dosDate,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,name.length,true);
    ch.setUint16(30,0,true); ch.setUint16(32,0,true); ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  let cdSize = 0; for(const c of central) cdSize += c.length;
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(4,0,true); end.setUint16(6,0,true);
  end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true); end.setUint32(16,offset,true); end.setUint16(20,0,true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
function xmlEsc(v){ return String(v==null?"":v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function colLetter(i){ let s=""; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
function sheetXml(rows){
  const widths = [];
  rows.forEach(r=>r.forEach((v,i)=>{ const l = String(v==null?"":v).length; widths[i] = Math.max(widths[i]||6, Math.min(48, l+3)); }));
  const cols = widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("");
  const data = rows.map((r,ri)=>{
    const cells = r.map((v,ci)=>{
      const ref = colLetter(ci) + (ri+1);
      const st = ri===0 ? ' s="1"' : "";
      if(typeof v === "number") return `<c r="${ref}"${st}><v>${v}</v></c>`;
      return `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    }).join("");
    return `<row r="${ri+1}">${cells}</row>`;
  }).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${cols}</cols><sheetData>${data}</sheetData></worksheet>`;
}
function buildXlsx(sheets){
  const used = new Set();
  const names = sheets.map((sh,i)=>{
    let n = String(sh.name||("Feuille"+(i+1))).replace(/[\[\]\:\*\?\/\\]/g," ").trim().slice(0,31) || ("Feuille"+(i+1));
    let base = n, k = 2;
    while(used.has(n.toLowerCase())){ n = base.slice(0,28) + " " + k; k++; }
    used.add(n.toLowerCase());
    return n;
  });
  const files = [
    { name:"[Content_Types].xml", content:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>` },
    { name:"_rels/.rels", content:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name:"xl/workbook.xml", content:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${names.map((n,i)=>`<sheet name="${xmlEsc(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>` },
    { name:"xl/_rels/workbook.xml.rels", content:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { name:"xl/styles.xml", content:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF2B705"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` }
  ];
  sheets.forEach((sh,i)=>files.push({ name:`xl/worksheets/sheet${i+1}.xml`, content: sheetXml(sh.rows) }));
  return makeZip(files);
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
function exportDeptExcel(){
  const dept = state.departments.find(d=>d.id===state.selectedDept);
  const rows = exportRows(state.selectedDept);
  if(rows.length===0){ alert("Cette rubrique ne contient aucun membre."); return; }
  const table = [["N°","Nom","Fonction","Lieu d'habitation","Contact","Sexe","Situation matrimoniale"]];
  rows.forEach((r,i)=> table.push([i+1, r.nom, r.role, r.lieu, r.contact, r.sexe, r.situ]));
  downloadBlob(buildXlsx([{ name: dept?dept.name:"Membres", rows: table }]), "membres-" + exportFileName(dept?dept.name:"") + "-" + exportDate() + ".xlsx");
}
function exportAllMembersExcel(){
  if(state.members.length===0){ alert("Aucun membre à sauvegarder."); return; }
  const sx = g => g==="homme" ? "Homme" : g==="femme" ? "Femme" : "";
  const header = ["N°","Rubrique","Nom","Fonction","Lieu d'habitation","Contact","Sexe","Situation matrimoniale","Commentaire"];
  const deptName = id => { const d = state.departments.find(x=>x.id===id); return d ? d.name : ""; };
  const sorted = state.members.slice().sort((a,b)=> deptName(a.dept_id).localeCompare(deptName(b.dept_id),"fr") || (a.name||"").localeCompare(b.name||"","fr"));
  const all = [header];
  sorted.forEach((m,i)=> all.push([i+1, deptName(m.dept_id), (m.name||"").trim(), (m.role||"").trim(), (m.location||"").trim(), (m.contact||"").trim(), sx(m.gender), maritalLabel(m.marital_status), (m.comment||"").trim()]));
  const sheets = [{ name:"Tous les membres", rows: all }];
  state.departments.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"","fr")).forEach(d=>{
    const list = sorted.filter(m=>m.dept_id===d.id);
    if(list.length===0) return;
    const t = [["N°","Nom","Fonction","Lieu d'habitation","Contact","Sexe","Situation matrimoniale"]];
    list.forEach((m,i)=> t.push([i+1, (m.name||"").trim(), (m.role||"").trim(), (m.location||"").trim(), (m.contact||"").trim(), sx(m.gender), maritalLabel(m.marital_status)]));
    sheets.push({ name: d.name, rows: t });
  });
  downloadBlob(buildXlsx(sheets), "sauvegarde-membres-" + exportDate() + ".xlsx");
}

// ---------------- MESSAGE GROUPÉ WHATSAPP ----------------
function waNumber(contact){
  const parts = String(contact||"").split(/[\/,;]|\bou\b/i);
  for(const part of parts){
    const raw = part.trim();
    let d = raw.replace(/\D/g,"");
    if(d.length < 8) continue;
    if(d.startsWith("00")) d = d.slice(2);
    else if(raw.startsWith("+")) { /* numéro déjà international */ }
    else if(d.startsWith("225") && d.length >= 11) { /* préfixe déjà présent */ }
    else if(d.length === 10 || d.length === 8) d = "225" + d;
    else continue;
    return d;
  }
  return null;
}
function openWhatsAppGroup(){
  state.waText = "";
  state.waSent = {};
  state.panel = "whatsapp";
  render();
}
function waBuildMessage(name){
  const n = (name||"").trim();
  const text = (state.waText||"").trim();
  if(/\{nom\}/i.test(text)) return text.replace(/\{nom\}/gi, n);
  const greet = (state.waGreet||"").trim();
  return greet ? (greet + " " + n + ",\n\n" + text) : text;
}
function updateWaPreview(){
  const el = document.getElementById("wa-preview");
  if(!el) return;
  const first = state.members.find(m=>m.dept_id===state.selectedDept && waNumber(m.contact));
  const text = (state.waText||"").trim();
  el.textContent = text ? waBuildMessage(first ? first.name : "Nom du membre") : "Ton message apparaîtra ici.";
}
function sendWhatsApp(memberId){
  const m = state.members.find(x=>String(x.id)===String(memberId));
  if(!m) return;
  const num = waNumber(m.contact);
  const text = (state.waText||"").trim();
  if(!text){ alert("Écris d'abord ton message."); return; }
  if(!num){ alert("Numéro invalide ou manquant pour " + (m.name||"ce membre") + "."); return; }
  const msg = waBuildMessage(m.name);
  window.open("https://wa.me/" + num + "?text=" + encodeURIComponent(msg), "_blank");
  state.waSent[memberId] = true;
  const b = document.getElementById("wa-btn-" + memberId);
  if(b){ b.textContent = "✓ Ouvert"; b.style.background = "var(--inputbg)"; b.style.color = "var(--muted)"; }
  const c = document.getElementById("wa-count");
  if(c) c.textContent = Object.keys(state.waSent).length;
}

  const confirming = state.confirmDelete?.type==="activity" && state.confirmDelete.id===a.id;

    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">

function renderActivitesTab(){
  const all = state.activities.slice();
  const list = state.actFilter==="all" ? all : state.actFilter==="__none__" ? all.filter(a=>!hasActType(a)) : all.filter(a=>a.category===state.actFilter);
  const dated = x => x.activity_date;
  const upcoming = list.filter(a=>dated(a) && daysUntil(a.activity_date)>=0).sort((a,b)=>a.activity_date.localeCompare(b.activity_date) || (a.activity_time||"").localeCompare(b.activity_time||""));
  const past = list.filter(a=>dated(a) && daysUntil(a.activity_date)<0).sort((a,b)=>b.activity_date.localeCompare(a.activity_date));
  const undated = list.filter(a=>!dated(a));
  const now = new Date(), ym = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const thisMonth = list.filter(a=>dated(a) && a.activity_date.startsWith(ym)).length;
  const next = upcoming[0];
  const stat = (label,val,extra) => `<div class="glass" style="flex:1;padding:10px 12px;min-width:0;"><div style="font-size:11px;color:var(--muted);">${label}</div><div class="font-display" style="font-size:22px;margin-top:2px;">${val}</div>${extra||""}</div>`;
  const nextCard = next
    ? stat("Prochaine", relDays(daysUntil(next.activity_date)), `<div style="font-size:11px;color:var(--muted2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${actType(next.category).icon} ${esc(next.title)}</div>`)
    : stat("Prochaine", "—", `<div style="font-size:11px;color:var(--muted2);margin-top:2px;">aucune prévue</div>`);
  const top = `<div style="display:flex;gap:8px;margin-bottom:14px;">${stat("À venir", upcoming.length)}${stat("Ce mois-ci", thisMonth)}${nextCard}</div>`;
  const chip = (v,label,icon) => {
    const on = state.actFilter===v;
    return `<button onclick='setActFilter(${attrJs(v)})' style="flex-shrink:0;border:none;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:700;${on?"background:linear-gradient(135deg,var(--gold),var(--gold2));color:#16112A;":"background:var(--inputbg);color:var(--muted);"}">${icon?icon+" ":""}${esc(label)}</button>`;
  };
  const chips = `<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;">${chip("all","Toutes","")}${ACT_TYPES.map(t=>chip(t.v,t.chip,t.icon)).join("")}${customActTypes().map(c=>chip(c,c,"🏷️")).join("")}${all.some(a=>!hasActType(a))?chip("__none__","Non classées","📌"):""}</div>`;
  const heading = t => `<h2 class="font-display" style="font-size:13px;color:var(--muted);margin:16px 0 8px;">${t}</h2>`;
  let out = `<button class="btn-teal" style="width:100%;margin-bottom:14px;" onclick="openNewActivity()">+ Ajouter une activité</button>` + top + chips;
  if(all.length===0) return out + `<div class="glass" style="padding:24px;text-align:center;"><p class="font-display" style="font-size:16px;margin:0 0 4px;">Aucune activité enregistrée</p><p style="font-size:13px;color:var(--muted);margin:0;">Ajoute un mariage, un baptême, une retraite, une veillée de prière ou un programme spécial.</p></div>`;
  if(list.length===0) return out + `<div class="glass" style="padding:20px;text-align:center;"><p style="font-size:13px;color:var(--muted);margin:0;">Aucune activité de ce type.</p></div>`;
  if(upcoming.length>0) out += heading(`À venir (${upcoming.length})`) + upcoming.map(a=>renderActivityCard(a,false)).join("");
  if(undated.length>0) out += heading(`Sans date (${undated.length})`) + undated.map(a=>renderActivityCard(a,false)).join("");
  if(past.length>0){
    const shown = state.actShowPast ? past : past.slice(0,6);
    out += heading(`Passées (${past.length})`) + shown.map(a=>renderActivityCard(a,true)).join("");
    if(past.length>6) out += `<button onclick="toggleActPast()" style="width:100%;background:none;border:none;padding:10px;font-size:13px;font-weight:600;color:#8B6A00;">${state.actShowPast?"Réduire la liste":`Voir toutes les activités passées (${past.length})`}</button>`;
  }
  return out;
}

        <div class="modal-body">

            <h2 class="font-display" style="font-size:18px;margin:0;">Nouvelle rubrique</h2>
            <button onclick="closePanel()" style="background:none;border:none;color:var(--muted);font-size:18px;">✕</button>
          </div>
          <input id="dept-name" placeholder="Ex : Conseil, Chorale, Jeunesse..." />
        </div>
        <div class="modal-footer"><button class="btn-teal" style="width:100%" onclick="handleAddDept()">Créer</button></div>
      </div>
    </div>
  `;
}

init();
</script>
</body>
