<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registre des membres</title>
<style>
  :root{
    --gold:#F2B705; --gold2:#FFD23F; --teal:#2BC4B5; --coral:#FF6F5E; --violet:#8B7FD6; --blue:#5FA8D3;
    --text:#241E38; --muted:#6B6485; --muted2:#948EB0; --border:#E9E4F7; --inputbg:#F4F1FA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; color:var(--text);
    font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(139,127,214,0.14), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(242,183,5,0.14), transparent 55%),
      linear-gradient(180deg,#FDFBFF 0%,#F7F2FD 45%,#FDF8EE 100%);
  }
  .font-display{font-weight:700;}
  .title-gradient{background:linear-gradient(120deg,#8B6A00,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .glass{background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);border:1px solid rgba(43,30,90,0.08);box-shadow:0 4px 20px rgba(43,30,90,0.06);border-radius:20px;}
  .glass-strong{background:rgba(255,255,255,0.94);backdrop-filter:blur(20px);border:1px solid rgba(43,30,90,0.1);box-shadow:0 8px 30px rgba(43,30,90,0.12);}
  .ledger-row{border-bottom:1px solid rgba(43,30,90,0.08);}
  .ledger-row:last-child{border-bottom:none;}
  input,textarea{color:var(--text);background:var(--inputbg);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:14px;outline:none;width:100%;font-family:inherit;}
  input:focus,textarea:focus{border-color:var(--gold);}
  input::placeholder,textarea::placeholder{color:var(--muted2);}
  button{font-family:inherit; cursor:pointer;}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#16112A;font-weight:700;border:none;border-radius:16px;padding:13px;font-size:14px;box-shadow:0 8px 24px rgba(242,183,5,0.3);}
  .btn-teal{background:linear-gradient(135deg,var(--teal),var(--blue));color:#0D2B28;font-weight:700;border:none;border-radius:16px;padding:12px;font-size:14px;}
  .container{max-width:640px;margin:0 auto;padding:24px 16px 130px;}
  .label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px;}
  .avatar{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#16112A;font-weight:700;font-size:13px;flex-shrink:0;overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .fab{position:fixed;bottom:96px;right:24px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;box-shadow:0 8px 24px rgba(242,183,5,0.4);font-size:26px;color:#16112A;background:linear-gradient(135deg,var(--gold),var(--coral));}
  .nav{position:fixed;bottom:16px;left:16px;right:16px;max-width:640px;margin:0 auto;border-radius:999px;display:flex;padding:6px;}
  .nav button{flex:1;background:none;border:none;padding:10px 0;border-radius:999px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--muted2);}
  .nav button.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#16112A;}
  .modal-overlay{position:fixed;inset:0;background:rgba(30,20,50,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;backdrop-filter:blur(2px);}
  .modal-panel{width:100%;max-width:480px;max-height:85vh;display:flex;flex-direction:column;border-radius:24px 24px 0 0;}
  @media(min-width:640px){.modal-overlay{align-items:center;} .modal-panel{border-radius:24px;}}
  .modal-body{overflow-y:auto;padding:20px;flex:1;}
  .modal-footer{padding:16px 20px;border-top:1px solid var(--border);}
  ::selection{background:var(--gold);color:#16112A;}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .photo-picker{width:88px;height:88px;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--inputbg);border:1.5px dashed var(--border);flex-shrink:0;position:relative;}
  .photo-picker img{width:100%;height:100%;object-fit:cover;}
  .photo-picker input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const SUPABASE_URL = "https://jtqgwnxljwdibzitatux.supabase.co";
const ANON_KEY = "sb_publishable_EPFVRKAf6H_3C3sZW3nHzg_y94crX28";
const PHOTO_BUCKET = "photos-membres1";

async function sb(path, opts={}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      "apikey": ANON_KEY,
      "Authorization": `Bearer ${ANON_KEY}`,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=representation",
      ...(opts.headers||{})
    }
  });
  if (!res.ok) {
    const txt = await res.text().catch(()=> "");
    throw new Error(`Erreur ${res.status}: ${txt}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function uploadMemberPhoto(file){
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = `member_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${PHOTO_BUCKET}/${path}`, {
    method: "POST",
    headers: {
      "apikey": ANON_KEY,
      "Authorization": `Bearer ${ANON_KEY}`,
      "Content-Type": file.type || "application/octet-stream"
    },
    body: file
  });
  if(!res.ok){
    const txt = await res.text().catch(()=> "");
    throw new Error(`Échec de l'envoi de la photo : ${txt}`);
  }
  return `${SUPABASE_URL}/storage/v1/object/public/${PHOTO_BUCKET}/${path}`;
}

const AVATAR_PAIRS = [["#F2B705","#FF6F5E"],["#2BC4B5","#5FA8D3"],["#8B7FD6","#FF6F5E"],["#5FA8D3","#2BC4B5"],["#FF6F5E","#F2B705"]];
function initials(name){ return (name||"").trim().split(/\s+/).slice(0,2).map(p=>p[0]?.toUpperCase()||"").join(""); }
function gradientFor(name){
  let h=0; const s=name||"";
  for(let i=0;i<s.length;i++) h = s.charCodeAt(i) + ((h<<5)-h);
  const p = AVATAR_PAIRS[Math.abs(h)%AVATAR_PAIRS.length];
  return `linear-gradient(135deg, ${p[0]}, ${p[1]})`;
}
function timeAgo(iso){
  if(!iso) return "";
  const diff=(Date.now()-new Date(iso).getTime())/1000;
  if(diff<60) return "à l'instant";
  if(diff<3600) return `il y a ${Math.floor(diff/60)} min`;
  if(diff<86400) return `il y a ${Math.floor(diff/3600)} h`;
  return `il y a ${Math.floor(diff/86400)} j`;
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

const state = {
  phase: "loading", // loading | setup | login | app
  admins: [],
  departments: [],
  members: [],
  session: null,
  tab: "journal",
  selectedDept: null,
  query: "",
  panel: null, // 'member' | 'dept' | null
  editingMemberId: null,
  memberForm: {name:"",role:"",location:"",contact:"",comment:"",photoUrl:""},
  newDeptName: "",
  confirmDelete: null,
  error: "",
  savingPhoto: false,
  setupSecondaries: [{name:"",code:""},{name:"",code:""},{name:"",code:""},{name:"",code:""}],
  loginCode: "",
};

let pendingPhotoFile = null;

const app = document.getElementById("app");

async function init(){
  try {
    state.admins = await sb("admins?select=*");
    state.phase = state.admins.length === 0 ? "setup" : "login";
  } catch(e) {
    state.error = "Impossible de contacter la base de données. Vérifie ta connexion.";
    state.phase = "login";
  }
  render();
}

async function loadData(){
  const [depts, mems] = await Promise.all([
    sb("departments?select=*&order=created_at.asc"),
    sb("members?select=*&order=added_at.desc"),
  ]);
  state.departments = depts;
  state.members = mems;
}

async function handleSetupSubmit(){
  const mainCode = document.getElementById("setup-main-code").value.trim();
  state.error = "";
  if(!mainCode){ state.error = "Le code de l'administrateur principal est obligatoire."; render(); return; }
  const rows = [{ id: "main", name: "Administrateur principal", code: mainCode, role: "main" }];
  for(let i=0;i<4;i++){
    const name = document.getElementById(`setup-sec-name-${i}`).value.trim();
    const code = document.getElementById(`setup-sec-code-${i}`).value.trim();
    if(name && !code){ state.error = `Donne un code à l'administrateur secondaire ${i+1} (ou laisse la ligne vide).`; render(); return; }
    if(name && code) rows.push({ id: `s_${i}_${Date.now()}`, name, code, role: "secondary" });
  }
  try {
    await sb("admins", { method:"POST", body: JSON.stringify(rows) });
    state.admins = await sb("admins?select=*");
    state.phase = "login";
    render();
  } catch(e){ state.error = "Échec de la création : " + e.message; render(); }
}

async function handleLogin(){
  const code = document.getElementById("login-code").value.trim();
  state.error = "";
  if(!code) return;
  try {
    const admins = await sb("admins?select=*");
    state.admins = admins;
    const found = admins.find(a => a.code === code);
    if(!found){ state.error = "Code invalide."; render(); return; }
    state.session = found;
    await loadData();
    state.phase = "app";
    state.tab = "journal";
    render();
  } catch(e){ state.error = "Erreur de connexion : " + e.message; render(); }
}

function logout(){ state.session = null; state.phase = "login"; render(); }

async function markSeen(){
  if(!state.session) return;
  const now = new Date().toISOString();
  try {
    await sb(`admins?id=eq.${state.session.id}`, { method:"PATCH", body: JSON.stringify({ last_seen: now }) });
    state.session.last_seen = now;
    const a = state.admins.find(x=>x.id===state.session.id);
    if(a) a.last_seen = now;
  } catch(e){}
}

function openTab(t){ state.tab = t; render(); if(t==="journal") markSeen().then(render); }

function computeActivity(){
  const items = [];
  for(const m of state.members){
    const dept = state.departments.find(d=>d.id===m.dept_id);
    if(m.added_at) items.push({ id:`${m.id}_add`, at:m.added_at, isEdit:false, by:m.added_by, text:`a ajouté ${m.name}${dept?` dans "${dept.name}"`:""}` });
    if(m.updated_at && m.updated_at !== m.added_at) items.push({ id:`${m.id}_upd`, at:m.updated_at, isEdit:true, by:m.updated_by||m.added_by, text:`a modifié la fiche de ${m.name}` });
  }
  items.sort((a,b)=> new Date(b.at)-new Date(a.at));
  return items;
}

function deptMembers(deptId){
  const q = state.query.trim().toLowerCase();
  return state.members.filter(m=>m.dept_id===deptId).filter(m=>
    !q || (m.name||"").toLowerCase().includes(q) || (m.location||"").toLowerCase().includes(q) || (m.role||"").toLowerCase().includes(q)
  );
}

function openNewMember(deptId){
  state.memberForm = {name:"",role:"",location:"",contact:"",comment:"",photoUrl:""};
  pendingPhotoFile = null;
  state.editingMemberId = null;
  state.selectedDept = deptId;
  state.panel = "member";
  render();
}
function openEditMember(m){
  state.memberForm = { name:m.name, role:m.role||"", location:m.location||"", contact:m.contact||"", comment:m.comment||"", photoUrl:m.photo_url||"" };
  pendingPhotoFile = null;
  state.editingMemberId = m.id;
  state.panel = "member";
  render();
}
function closePanel(){ pendingPhotoFile = null; state.panel = null; render(); }

function onPhotoSelected(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  pendingPhotoFile = file;
  const reader = new FileReader();
  reader.onload = () => {
    const box = document.getElementById("mf-photo-box");
    if(box) box.innerHTML = `<img src="${reader.result}" /><input type="file" accept="image/*" onchange="onPhotoSelected(event)" />`;
  };
  reader.readAsDataURL(file);
}

async function handleSaveMember(){
  const name = document.getElementById("mf-name").value.trim();
  if(!name) return;
  state.error = "";
  const form = {
    name,
    role: document.getElementById("mf-role").value.trim(),
    location: document.getElementById("mf-location").value.trim(),
    contact: document.getElementById("mf-contact").value.trim(),
    comment: document.getElementById("mf-comment").value.trim(),
  };
  try {
    if(pendingPhotoFile){
      state.savingPhoto = true; render();
      form.photo_url = await uploadMemberPhoto(pendingPhotoFile);
      state.savingPhoto = false;
    } else if(state.editingMemberId){
      form.photo_url = state.memberForm.photoUrl || null;
    }
    if(state.editingMemberId){
      await sb(`members?id=eq.${state.editingMemberId}`, { method:"PATCH", body: JSON.stringify({ ...form, updated_by: state.session.name, updated_at: new Date().toISOString() }) });
    } else {
      await sb("members", { method:"POST", body: JSON.stringify([{ ...form, dept_id: state.selectedDept, added_by: state.session.name }]) });
    }
    pendingPhotoFile = null;
    await loadData();
    state.panel = null;
    render();
  } catch(e){ state.savingPhoto = false; state.error = "Erreur d'enregistrement : " + e.message; render(); }
}

async function handleDeleteMember(id){
  try { await sb(`members?id=eq.${id}`, { method:"DELETE" }); await loadData(); state.confirmDelete=null; render(); }
  catch(e){ state.error = e.message; render(); }
}

function openNewDept(){ state.newDeptName=""; state.panel="dept"; render(); }
async function handleAddDept(){
  const name = document.getElementById("dept-name").value.trim();
  if(!name) return;
  try { await sb("departments", { method:"POST", body: JSON.stringify([{name}]) }); await loadData(); state.panel=null; render(); }
  catch(e){ state.error = e.message; render(); }
}
async function handleDeleteDept(id){
  try { await sb(`members?dept_id=eq.${id}`, { method:"DELETE" }); await sb(`departments?id=eq.${id}`, { method:"DELETE" }); await loadData(); state.confirmDelete=null; if(state.selectedDept===id) state.selectedDept=null; render(); }
  catch(e){ state.error = e.message; render(); }
}

function selectDept(id){ state.selectedDept = id; state.query=""; render(); }
function backToDepts(){ state.selectedDept = null; render(); }

// ---------------- RENDER ----------------
function render(){
  if(state.phase === "loading"){
    app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted)">
      <span class="spin" style="display:inline-block">⏳</span><span style="font-size:14px">Chargement...</span></div>`;
    return;
  }
  if(state.phase === "setup"){ renderSetup(); return; }
  if(state.phase === "login"){ renderLogin(); return; }
  renderMain();
}

function renderSetup(){
  app.innerHTML = `
    <div class="container" style="max-width:420px;padding-top:56px;">
      <div class="avatar" style="width:48px;height:48px;border-radius:16px;margin-bottom:20px;background:linear-gradient(135deg,var(--gold),var(--coral));">🛡️</div>
      <p style="font-size:11px;letter-spacing:.25em;color:var(--muted);margin:0 0 4px;text-transform:uppercase;">CONFIGURATION INITIALE</p>
      <h1 class="font-display title-gradient" style="font-size:28px;margin:0 0 8px;">Registre des membres</h1>
      <p style="font-size:14px;color:var(--muted);margin:0 0 24px;">Définis ton code d'administrateur principal, puis (optionnel) les 4 administrateurs secondaires.</p>
      <div class="glass" style="padding:16px;margin-bottom:12px;">
        <label class="label">🛡️ Code — Administrateur principal *</label>
        <input id="setup-main-code" placeholder="Choisis un code" />
      </div>
      ${[0,1,2,3].map(i=>`
        <div class="glass" style="padding:16px;margin-bottom:12px;">
          <label class="label" style="color:var(--teal)">Administrateur secondaire ${i+1}</label>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <input id="setup-sec-name-${i}" placeholder="Nom" />
            <input id="setup-sec-code-${i}" placeholder="Code" />
          </div>
        </div>
      `).join("")}
      ${state.error ? `<p style="color:var(--coral);font-size:13px;margin:0 0 12px;">${esc(state.error)}</p>` : ""}
      <button class="btn-gold" style="width:100%" onclick="handleSetupSubmit()">Créer le registre</button>
    </div>
  `;
}

function renderLogin(){
  app.innerHTML = `
    <div class="container" style="max-width:380px;display:flex;flex-direction:column;justify-content:center;min-height:100vh;padding-top:0;padding-bottom:0;">
      <div class="avatar" style="width:56px;height:56px;border-radius:18px;margin:0 auto 20px;background:linear-gradient(135deg,var(--gold),var(--coral));">🛡️</div>
      <p style="font-size:11px;letter-spacing:.25em;color:var(--muted);margin:0 0 4px;text-align:center;text-transform:uppercase;">ACCÈS ADMINISTRATEUR</p>
      <h1 class="font-display title-gradient" style="font-size:28px;margin:0 0 24px;text-align:center;">Registre des membres</h1>
      <div class="glass" style="padding:14px;display:flex;align-items:center;gap:8px;margin-bottom:12px;">
        <span>🔑</span>
        <input id="login-code" type="password" placeholder="Entre ton code d'accès" style="background:transparent;border:none;padding:4px;" />
      </div>
      ${state.error ? `<p style="color:var(--coral);font-size:13px;margin:0 0 12px;text-align:center;">${esc(state.error)}</p>` : ""}
      <button class="btn-gold" style="width:100%" onclick="handleLogin()">Entrer</button>
    </div>
  `;
  document.getElementById("login-code").addEventListener("keydown", e => { if(e.key==="Enter") handleLogin(); });
  document.getElementById("login-code").focus();
}

function renderMain(){
  const activity = computeActivity();
  const unseen = activity.filter(a => !state.session.last_seen || new Date(a.at) > new Date(state.session.last_seen)).length;
  const isMain = state.session.role === "main";

  let title = "Journal d'activité";
  if(state.tab==="rubriques"){
    title = state.selectedDept ? (state.departments.find(d=>d.id===state.selectedDept)?.name || "") : "Rubriques";
  } else if(state.tab==="admin"){ title = "Administration"; }

  let body = "";
  if(state.tab === "journal"){
    body = `<div class="glass" style="overflow:hidden;">
      ${activity.length===0 ? `<div style="text-align:center;padding:60px 16px;"><p class="font-display" style="font-size:18px;margin:0 0 4px;">Rien à signaler</p><p style="color:var(--muted);font-size:14px;margin:0;">Les ajouts et modifications apparaîtront ici.</p></div>` :
        activity.map(a=>`
          <div class="ledger-row" style="padding:14px 16px;display:flex;gap:12px;">
            <div style="width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:${a.isEdit?'rgba(43,196,181,0.15)':'rgba(242,183,5,0.15)'}">
              <div style="width:8px;height:8px;border-radius:50%;background:${a.isEdit?'var(--teal)':'var(--gold)'}"></div>
            </div>
            <div style="flex:1;min-width:0;">
              <p style="font-size:14px;margin:0;"><span style="font-weight:600;color:${a.isEdit?'var(--teal)':'#B8890A'}">${esc(a.by)}</span> ${esc(a.text)}</p>
              <p style="font-size:11px;color:var(--muted2);margin:3px 0 0;">${timeAgo(a.at)}</p>
            </div>
          </div>
        `).join("")}
    </div>`;
  } else if(state.tab === "rubriques" && !state.selectedDept){
    body = state.departments.length===0 ? `
      <div class="glass" style="text-align:center;padding:70px 16px;">
        <p class="font-display" style="font-size:18px;margin:0 0 4px;">Aucune rubrique</p>
        <p style="color:var(--muted);font-size:14px;margin:0;">${isMain?"Crée la première avec le bouton +.":"En attente de création par l'administrateur principal."}</p>
      </div>` :
      `<div style="display:flex;flex-direction:column;gap:10px;">${state.departments.map(d=>{
        const count = state.members.filter(m=>m.dept_id===d.id).length;
        return `<button onclick="selectDept('${d.id}')" class="glass" style="display:flex;align-items:center;justify-content:space-between;padding:16px;text-align:left;border:none;width:100%;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="avatar" style="border-radius:16px;background:${gradientFor(d.name)}">${initials(d.name)||"👥"}</div>
            <div><p class="font-display" style="font-size:15px;margin:0;">${esc(d.name)}</p><p style="font-size:12px;color:var(--muted);margin:2px 0 0;">${count} membre${count!==1?'s':''}</p></div>
          </div>
          <span style="color:var(--muted2)">›</span>
        </button>`;
      }).join("")}</div>`;
  } else if(state.tab === "rubriques" && state.selectedDept){
    const list = deptMembers(state.selectedDept);
    body = `
      <button onclick="backToDepts()" style="background:none;border:none;color:var(--muted);font-size:13px;margin-bottom:16px;padding:0;">← Toutes les rubriques</button>
      <div class="glass" style="display:flex;align-items:center;gap:8px;padding:12px 14px;margin-bottom:16px;">
        <span>🔍</span><input id="search-input" placeholder="Chercher un nom, un lieu, une fonction..." value="${esc(state.query)}" style="background:transparent;border:none;padding:4px;" oninput="state.query=this.value; renderMainListOnly();" />
      </div>
      <div id="member-list">${renderMemberList(list)}</div>
    `;
  } else if(state.tab === "admin" && isMain){
    body = `
      <div style="margin-bottom:20px;">
        <h2 class="font-display" style="font-size:13px;color:var(--muted);margin:0 0 8px;">Rubriques</h2>
        <div class="glass" style="overflow:hidden;">
          ${state.departments.length===0 ? `<p style="padding:16px;color:var(--muted);font-size:14px;margin:0;">Aucune rubrique créée.</p>` :
            state.departments.map(d=>`
              <div class="ledger-row" style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center;">
                <span style="font-size:14px;">${esc(d.name)}</span>
                ${state.confirmDelete?.type==="dept" && state.confirmDelete.id===d.id ?
                  `<span style="display:flex;gap:8px;font-size:12px;"><button onclick="handleDeleteDept('${d.id}')" style="background:none;border:none;color:var(--coral);font-weight:600;">Confirmer</button><button onclick="state.confirmDelete=null;render();" style="background:none;border:none;color:var(--muted);">Annuler</button></span>` :
                  `<button onclick="state.confirmDelete={type:'dept',id:'${d.id}'};render();" style="background:none;border:none;color:var(--coral);">🗑</button>`}
              </div>`).join("")}
        </div>
      </div>
      <div>
        <h2 class="font-display" style="font-size:13px;color:var(--muted);margin:0 0 8px;">Administrateurs</h2>
        <div class="glass" style="overflow:hidden;">
          ${state.admins.map(a=>`<div class="ledger-row" style="padding:12px 16px;display:flex;align-items:center;gap:8px;"><span style="color:var(--teal)">✓</span><span style="font-size:14px;">${esc(a.name)}</span> <span style="font-size:11px;color:var(--muted2)">(${a.role==='main'?'principal':'secondaire'})</span></div>`).join("")}
        </div>
      </div>
    `;
  }

  app.innerHTML = `
    <div class="container">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;">
        <div>
          <p style="font-size:11px;letter-spacing:.25em;color:var(--muted);margin:0 0 4px;text-transform:uppercase;">REGISTRE DES MEMBRES</p>
          <h1 class="font-display title-gradient" style="font-size:24px;margin:0;line-height:1.25;">${esc(title)}</h1>
          ${state.tab==="rubriques" && !state.selectedDept ? `<p style="font-size:12px;color:var(--muted2);margin:4px 0 0;">${state.departments.length} rubrique${state.departments.length!==1?'s':''} · ${state.members.length} membre${state.members.length!==1?'s':''}</p>` : ""}
        </div>
        <button onclick="logout()" class="glass" style="border:none;padding:7px 12px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;">↩ ${esc(state.session.name.split(" ")[0])}</button>
      </div>
      ${state.error ? `<p style="color:var(--coral);font-size:13px;margin:0 0 12px;">${esc(state.error)}</p>` : ""}
      ${body}
    </div>

    ${state.tab==="rubriques" && state.selectedDept ? `<button class="fab" onclick="openNewMember('${state.selectedDept}')">+</button>` : ""}
    ${state.tab==="rubriques" && !state.selectedDept && isMain ? `<button class="fab" onclick="openNewDept()">📁</button>` : ""}

    <nav class="nav glass-strong">
      <button class="${state.tab==='journal'?'active':''}" onclick="openTab('journal')" style="position:relative;">
        🔔 ${unseen>0?`<span style="position:absolute;top:6px;right:32%;width:8px;height:8px;border-radius:50%;background:var(--coral)"></span>`:""}<span>Journal</span>
      </button>
      <button class="${state.tab==='rubriques'?'active':''}" onclick="state.tab='rubriques';state.selectedDept=null;render();">👥<span>Rubriques</span></button>
      ${isMain ? `<button class="${state.tab==='admin'?'active':''}" onclick="openTab('admin')">🛡️<span>Admin</span></button>` : ""}
    </nav>

    ${state.panel==="member" ? renderMemberModal() : ""}
    ${state.panel==="dept" ? renderDeptModal() : ""}
  `;
}

function renderMemberList(list){
  if(list.length===0) return `<div class="glass" style="text-align:center;padding:50px 16px;"><p style="color:var(--muted);font-size:14px;margin:0;">Aucun membre enregistré ici.</p></div>`;
  return `<div style="display:flex;flex-direction:column;gap:10px;">${list.map(m=>`
    <div class="glass" style="padding:16px;">
      <div style="display:flex;align-items:flex-start;gap:12px;">
        <div class="avatar" style="border-radius:16px;background:${gradientFor(m.name)}">${m.photo_url ? `<img src="${esc(m.photo_url)}" />` : initials(m.name)}</div>
        <div style="flex:1;min-width:0;">
          <h3 class="font-display" style="font-size:15px;margin:0;">${esc(m.name)}</h3>
          ${m.role?`<p style="font-size:12px;color:#B8890A;margin:2px 0 0;">${esc(m.role)}</p>`:""}
          <div style="display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:12px;color:var(--muted);">
            ${m.location?`<span>📍 ${esc(m.location)}</span>`:""}
            ${m.contact?`<span>📞 ${esc(m.contact)}</span>`:""}
            ${m.comment?`<span>💬 ${esc(m.comment)}</span>`:""}
          </div>
          <p style="font-size:10px;color:var(--muted2);margin:8px 0 0;">Ajouté par ${esc(m.added_by||"")} · ${timeAgo(m.added_at)}</p>
          <div style="display:flex;gap:14px;margin-top:10px;">
            <button onclick='openEditMember(${JSON.stringify(m).replace(/'/g,"&#39;")})' style="background:none;border:none;color:var(--teal);font-size:12px;font-weight:600;">✏ Modifier</button>
            ${state.confirmDelete?.type==="member" && state.confirmDelete.id===m.id ?
              `<span style="display:flex;gap:8px;font-size:12px;"><span style="color:var(--muted)">Supprimer ?</span><button onclick="handleDeleteMember('${m.id}')" style="background:none;border:none;color:var(--coral);font-weight:600;">Oui</button><button onclick="state.confirmDelete=null;render();" style="background:none;border:none;color:var(--muted);">Non</button></span>` :
              `<button onclick="state.confirmDelete={type:'member',id:'${m.id}'};render();" style="background:none;border:none;color:var(--coral);font-size:12px;font-weight:600;">🗑 Supprimer</button>`}
          </div>
        </div>
      </div>
    </div>
  `).join("")}</div>`;
}

function renderMainListOnly(){
  document.getElementById("member-list").innerHTML = renderMemberList(deptMembers(state.selectedDept));
}

function renderMemberModal(){
  const f = state.memberForm;
  return `
    <div class="modal-overlay">
      <div class="modal-panel glass-strong">
        <div class="modal-body">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h2 class="font-display" style="font-size:18px;margin:0;">${state.editingMemberId?"Modifier la fiche":"Nouveau membre"}</h2>
            <button onclick="closePanel()" style="background:none;border:none;color:var(--muted);font-size:18px;">✕</button>
          </div>
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div style="display:flex;align-items:center;gap:14px;">
              <div class="photo-picker" id="mf-photo-box">
                ${f.photoUrl ? `<img src="${esc(f.photoUrl)}" />` : `<span style="font-size:24px;color:var(--muted2)">📷</span>`}
                <input type="file" accept="image/*" onchange="onPhotoSelected(event)" />
              </div>
              <div style="font-size:12px;color:var(--muted);">Touche l'icône pour ${f.photoUrl?"changer la":"ajouter une"} photo.</div>
            </div>
            <div><label class="label">Nom *</label><input id="mf-name" value="${esc(f.name)}" placeholder="Nom complet" /></div>
            <div><label class="label">Fonction dans l'église</label><input id="mf-role" value="${esc(f.role)}" placeholder="Ex : Diacre, Choriste..." /></div>
            <div><label class="label">Lieu d'habitation</label><input id="mf-location" value="${esc(f.location)}" placeholder="Ville, quartier..." /></div>
            <div><label class="label">Contact</label><input id="mf-contact" value="${esc(f.contact)}" placeholder="Téléphone" /></div>
            <div><label class="label">Commentaire</label><textarea id="mf-comment" rows="3" placeholder="Note libre...">${esc(f.comment)}</textarea></div>
          </div>
        </div>
        <div class="modal-footer"><button class="btn-gold" style="width:100%" onclick="handleSaveMember()" ${state.savingPhoto?"disabled":""}>${state.savingPhoto?"Envoi de la photo...":(state.editingMemberId?"Enregistrer":"Ajouter")}</button></div>
      </div>
    </div>
  `;
}

function renderDeptModal(){
  return `
    <div class="modal-overlay">
      <div class="modal-panel glass-strong">
        <div class="modal-body">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h2 class="font-display" style="font-size:18px;margin:0;">Nouvelle rubrique</h2>
            <button onclick="closePanel()" style="background:none;border:none;color:var(--muted);font-size:18px;">✕</button>
          </div>
          <input id="dept-name" placeholder="Ex : Conseil, Chorale, Jeunesse..." />
        </div>
        <div class="modal-footer"><button class="btn-teal" style="width:100%" onclick="handleAddDept()">Créer</button></div>
      </div>
    </div>
  `;
}

init();
</script>
</body>
  </html>
